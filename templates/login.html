<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — جمال سولوشنز</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e2e8f0;
      padding: 1rem;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }
    .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 2rem; }

    .field { text-align: right; margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }
    .field input {
      width: 100%;
      padding: 0.9rem 1rem;
      background: rgba(15, 23, 42, 0.7);
      border: 2px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 1rem;
      font-family: inherit;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input::placeholder {
      color: #64748b;
      letter-spacing: 0.05em;
      text-transform: none;
    }
    .field input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    .submit-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.9rem 1.25rem;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .submit-btn .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(15, 23, 42, 0.3);
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .submit-btn.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      padding: 0.75rem;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: none;
    }
    .error.show { display: block; }

    .hint {
      margin-top: 1.5rem;
      padding: 0.75rem;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 10px;
      font-size: 0.82rem;
      color: #7dd3fc;
      line-height: 1.6;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #64748b;
      line-height: 1.6;
    }
    .footer a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Jamal Solutions</div>
    <div class="subtitle">منصة الأرقام الافتراضية</div>

    <div class="error" id="err"></div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="code">كود الدخول</label>
        <input
          type="text"
          id="code"
          name="code"
          placeholder="JS-LOGIN-XXXXXXXXXXXX"
          required
          autofocus
          spellcheck="false"
        />
      </div>
      <button type="submit" class="submit-btn" id="btn">
        <span class="spinner"></span>
        <span class="btn-text">دخول</span>
      </button>
    </form>

    <div class="hint">
      🔑 لا تملك كود دخول؟ تواصل مع الإدارة للحصول عليه.
    </div>

    <div class="footer">
      بالمتابعة أنت توافق على
      <a href="#">شروط الاستخدام</a> و
      <a href="#">سياسة الخصوصية</a>.
    </div>
  </div>

  <script>
    (function () {
      const form  = document.getElementById('loginForm');
      const input = document.getElementById('code');
      const btn   = document.getElementById('btn');
      const errBox = document.getElementById('err');
      const btnText = btn.querySelector('.btn-text');

      // ── تعبئة تلقائية لو جاء الكود في الرابط ?code=...
      const params = new URLSearchParams(location.search);
      if (params.get('code')) {
        input.value = params.get('code').toUpperCase();
      }

      // ── رسائل الخطأ القادمة من الخادم عبر ?error=...
      const serverError = params.get('error');
      if (serverError) {
        const messages = {
          session_expired: 'انتهت جلستك. الرجاء تسجيل الدخول مجدداً.',
          invalid_code: 'الكود غير صحيح أو منتهي الصلاحية.',
          not_authenticated: 'الرجاء تسجيل الدخول أولاً.',
        };
        showError(messages[serverError] || ('حدث خطأ: ' + serverError));
      }

      function showError(msg) {
        errBox.textContent = msg;
        errBox.classList.add('show');
      }
      function clearError() {
        errBox.textContent = '';
        errBox.classList.remove('show');
      }
      function setLoading(on) {
        btn.disabled = on;
        btn.classList.toggle('loading', on);
        btnText.textContent = on ? 'جارٍ التحقق...' : 'دخول';
      }

      // ── تنسيق تلقائي للكود أثناء الكتابة (حروف كبيرة، بدون مسافات)
      input.addEventListener('input', () => {
        const pos = input.selectionStart;
        input.value = input.value.toUpperCase().replace(/\s+/g, '');
        input.setSelectionRange(pos, pos);
        clearError();
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const code = input.value.trim().toUpperCase();
        if (!code) {
          showError('الرجاء إدخال كود الدخول');
          input.focus();
          return;
        }

        setLoading(true);
        try {
          const res = await fetch('/api/v1/auth/login-with-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code }),
          });

          let data = {};
          try { data = await res.json(); } catch (_) {}

          if (!res.ok) {
            showError(data.detail || 'تعذّر تسجيل الدخول، تحقق من الكود');
            setLoading(false);
            input.select();
            return;
          }

          // ✅ نجاح — التوجيه إلى الشاشة الموحّدة
          window.location.href = data.redirect || '/buy';
        } catch (err) {
          showError('تعذّر الاتصال بالخادم. تحقق من الإنترنت وحاول مجدداً.');
          setLoading(false);
        }
      });
    })();
  </script>
</body>
</html>
