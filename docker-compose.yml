version: "3.9"

services:
  app:
    build: .
    container_name: jamal_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jamal_net

  db:
    image: postgres:16-alpine
    container_name: jamal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jamal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jamal_pass}
      POSTGRES_DB: ${POSTGRES_DB:-jamal_solutions}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - jamal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jamal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: jamal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - jamal_net

networks:
  jamal_net:
    driver: bridge

volumes:
  pg_data:
