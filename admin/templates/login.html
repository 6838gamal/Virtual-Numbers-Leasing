<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — لوحة الأدمن</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center text-slate-100 p-4">

  <div class="bg-slate-800 rounded-2xl shadow-2xl p-8 w-full max-w-md border border-slate-700">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-lg mb-3">
        🔐
      </div>
      <h1 class="text-2xl font-bold">لوحة الأدمن</h1>
      <p class="text-xs text-slate-400 mt-1">جمال سولوشنز — Virtual Numbers</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="text-xs font-bold text-slate-400 mb-2 block">البريد الإلكتروني</label>
        <input type="email" id="admin-email-input"
               placeholder="admin@virtual-num.com"
               onkeypress="if(event.key==='Enter') doLogin()"
               class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none text-sm transition-all"
               dir="ltr" autocomplete="username" autofocus>
      </div>

      <div>
        <label class="text-xs font-bold text-slate-400 mb-2 block">كلمة المرور</label>
        <input type="password" id="admin-password-input"
               placeholder="••••••••"
               onkeypress="if(event.key==='Enter') doLogin()"
               class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none text-sm transition-all"
               dir="ltr" autocomplete="current-password">
      </div>

      <div id="login-error" class="hidden text-xs font-bold text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg p-3"></div>

      <button onclick="doLogin()" id="login-btn"
              class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/>
        </svg>
        دخول
      </button>

      <p class="text-[10px] text-slate-500 text-center leading-relaxed">
        تُحفظ الجلسة في <code class="mono bg-slate-900 px-1 rounded">sessionStorage</code> فقط.
      </p>
    </div>
  </div>

  <script>
    // إن كان هناك token صالح مسبقاً، اذهب مباشرة للوحة
    (async function () {
      const token = sessionStorage.getItem('admin_token');
      if (!token) return;
      try {
        const r = await fetch('/api/v1/admin/whoami', {
          headers: { 'X-Admin-Secret': token },
        });
        if (r.ok) {
          window.location.replace('/admin-panel');
        } else {
          sessionStorage.removeItem('admin_token');
        }
      } catch (_) {}
    })();

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.add('hidden'), 6000);
    }

    async function doLogin() {
      const email = document.getElementById('admin-email-input').value.trim();
      const password = document.getElementById('admin-password-input').value;
      if (!email || !password) {
        showError('الرجاء إدخال البريد وكلمة المرور');
        return;
      }

      const btn = document.getElementById('login-btn');
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '⏳ جاري التحقق...';
      document.getElementById('login-error').classList.add('hidden');

      try {
        const r = await fetch('/api/v1/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        if (r.status === 403) {
          showError('❌ البريد أو كلمة المرور غير صحيحة');
          btn.disabled = false; btn.innerHTML = original;
          return;
        }
        if (r.status === 503) {
          showError('⚠️ ADMIN_EMAIL/ADMIN_SECRET غير مضبوط على السيرفر');
          btn.disabled = false; btn.innerHTML = original;
          return;
        }
        if (!r.ok) {
          showError('خطأ: HTTP ' + r.status);
          btn.disabled = false; btn.innerHTML = original;
          return;
        }

        const data = await r.json();
        sessionStorage.setItem('admin_token', data.token);
        window.location.replace('/admin-panel');
      } catch (e) {
        showError('فشل الاتصال: ' + e.message);
        btn.disabled = false; btn.innerHTML = original;
      }
    }
  </script>
</body>
</html>
